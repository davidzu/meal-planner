es:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%d de %B de %Y"
    day_names:
      - domingo
      - lunes
      - martes
      - miércoles
      - jueves
      - viernes
      - sábado
    abbr_day_names:
      - dom
      - lun
      - mar
      - mié
      - jue
      - vie
      - sáb
    month_names:
      - ~
      - enero
      - febrero
      - marzo
      - abril
      - mayo
      - junio
      - julio
      - agosto
      - septiembre
      - octubre
      - noviembre
      - diciembre
    abbr_month_names:
      - ~
      - ene
      - feb
      - mar
      - abr
      - may
      - jun
      - jul
      - ago
      - sep
      - oct
      - nov
      - dic
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: no puede estar en blanco
      taken: ya está en uso
      invalid: no es válido
      required: debe existir
      not_a_number: no es un número
      greater_than: debe ser mayor que %{count}
      greater_than_or_equal_to: debe ser mayor o igual que %{count}
      less_than: debe ser menor que %{count}
      less_than_or_equal_to: debe ser menor o igual que %{count}
      inclusion: no está incluido en la lista
      confirmation: no coincide
      too_short:
        one: es demasiado corto (mínimo %{count} carácter)
        other: es demasiado corto (mínimo %{count} caracteres)
      too_long:
        one: es demasiado largo (máximo %{count} carácter)
        other: es demasiado largo (máximo %{count} caracteres)
  activerecord:
    models:
      user: Usuario
      recipe: Receta
      household: Hogar
      week: Semana
      day: Día
      menu_day:
        one: platillo planificado
        other: platillos planificados
      ingredient: Ingrediente
      tag: Etiqueta
    attributes:
      user:
        email: Correo
        role: Rol
      recipe:
        name: Nombre
        description: Descripción
        instructions: Instrucciones
        prep_time_min: Tiempo
        base_servings: Porciones
        calories_per_serving: Kcal
      household:
        name: Nombre
    errors:
      messages:
        blank: no puede estar en blanco
        taken: ya está en uso
        invalid: no es válido
        required: debe existir
        not_a_number: no es un número
        greater_than: debe ser mayor que %{count}
        greater_than_or_equal_to: debe ser mayor o igual que %{count}
        inclusion: no está incluido en la lista
        restrict_dependent_destroy:
          has_one: no se puede eliminar porque existe un %{record} dependiente
          has_many: no se puede eliminar porque existen %{record} dependientes
      models:
        user:
          attributes:
            email:
              taken: ya está en uso
        recipe:
          attributes:
            base:
              restrict_dependent_destroy:
                has_many: no se puede eliminar porque está asignada a un menú de la semana.
