# Render Blueprint — meal planner (Rails 8.1 + Postgres)
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE (2026-09-09): the workspace already runs one free-tier Postgres
# (sonic-blog-db, dpg-dagdnj740ujc73ens3dg-a) and Render allows only one
# active free database per account. Per decision, meal-planner shares that
# instance: its `meal_planner_production` database is created automatically
# by `rails db:prepare` on first deploy (the sonic_blog role owns the
# instance). DATABASE_URL is therefore supplied as a plain env var, not
# fromDatabase. If this app ever gets its own database, restore the
# `databases:` block and switch DATABASE_URL back to `fromDatabase`.
services:
  - type: web
    name: meal-planner
    runtime: ruby
    plan: free
    branch: main
    autoDeploy: true
    # db:prepare migrates an existing DB or creates + migrates + seeds a fresh one.
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:prepare
    startCommand: bundle exec rails server
    healthCheckPath: /up
    envVars:
      # Internal connection string of the shared free instance
      # (dpg-dagdnj740ujc73ens3dg-a), database meal_planner_production.
      # Set in the dashboard / via API — never commit the password.
      - key: DATABASE_URL
        sync: false
      # Never commit the master key. Paste the value of config/master.key
      # into the Render dashboard (or set it via the API) on first deploy.
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"

# databases:
#   - name: meal-planner-db
#     databaseName: meal_planner_production
#     plan: free
